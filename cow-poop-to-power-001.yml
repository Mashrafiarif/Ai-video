name: cow-poop-to-power-001

on:
  workflow_dispatch:
  push:
    paths:
      - 'storyline.json'
      - 'render.py'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only Pillow
        run: pip install Pillow

      - name: Render video
        run: python render.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: cow-poop-to-power-001
          path: output.mp4
          if-no-files-found: error
