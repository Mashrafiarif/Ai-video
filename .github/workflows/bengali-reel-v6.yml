name: Bengali Reel V6 - Image Based

on:
  workflow_dispatch:
    inputs:
      width:
        type: choice
        description: Resolution
        options: ['720', '1080']
        default: '1080'
      mode:
        type: choice
        description: Full 90 seconds or quick 18-second preview
        options: ['full', 'preview']
        default: 'full'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight renderer
        run: |
          python -m pip install pillow==11.3.0 imageio-ffmpeg==0.6.0
          python -m pip check
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Bengali text shaping unavailable'"

      - name: Extract real image assets and renderer
        run: |
          test -f hook-assets-v6.zip || { echo 'Upload hook-assets-v6.zip to repository root'; exit 1; }
          python -m zipfile -e hook-assets-v6.zip v6
          test -f v6/render.py
          for name in feed toy child budget; do test -s "v6/assets/$name.jpg" || exit 1; done

      - name: Download Bengali font
        run: |
          curl -g -fL --retry 3 --connect-timeout 15 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/NotoSansBengali%5Bwdth%2Cwght%5D.ttf' -o bengali.ttf
          python -c "from PIL import ImageFont; ImageFont.truetype('bengali.ttf',40); print('Bengali font verified')"

      - name: Render image animation and SFX
        env:
          WIDTH: ${{ inputs.width }}
          MODE: ${{ inputs.mode }}
          BN_FONT: bengali.ttf
        run: |
          if [ "$MODE" = preview ]; then export SCENE_SECONDS=1; else export SCENE_SECONDS=5; fi
          python -u v6/render.py
          ls -lh output

      - name: Download final animation pack
        uses: actions/upload-artifact@v4
        with:
          name: bengali-animation-library-v6
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
