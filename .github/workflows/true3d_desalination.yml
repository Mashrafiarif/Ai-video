name: MeanwhileMash - Desalination V3 FFmpeg Fix
on:
  workflow_dispatch:
    inputs:
      quality:
        type: choice
        options: [preview, full, stills]
        default: preview
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      QUALITY: ${{ inputs.quality }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache renderer Python downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-true3d-py311-vtk962-numpy-pillow-ffmpeg-imageio-v2
      - name: Install renderer dependencies (fast path)
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for pkg in libgl1 libegl1 libgl1-mesa-dri; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          if [[ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then
            missing+=(fonts-dejavu-core)
          fi
          if (( ${#missing[@]} )); then
            printf 'Missing system packages: %s\n' "${missing[*]}"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          python -m pip install --disable-pip-version-check vtk==9.6.2 numpy pillow imageio-ffmpeg==0.6.0
          python -c "import imageio_ffmpeg, subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-version'], check=True)"
      - name: Render approved geometry
        shell: bash
        run: |
          cat > episode.py <<'PYCODE'
          import os, math, random, argparse, subprocess, wave, bisect
          import numpy as np
          import imageio_ffmpeg
          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()
          import vtk
          from vtk.util.numpy_support import vtk_to_numpy
          from PIL import Image, ImageDraw, ImageFont
          from functools import lru_cache
          W,H=540,960
          BG=(.035,.075,.095); MET=(.70,.77,.79); DARK=(.17,.24,.28); BLUE=(.12,.54,.82); CLEAN=(.27,.85,.97); LIME=(.78,1,.04); SALT=(.98,.51,.20); SAND=(.76,.60,.35); WHITE=(.95,.97,.97)
          random.seed(5)
          class Scene:
           def __init__(self):
            self.r=vtk.vtkRenderer(); self.r.SetBackground(*BG); self.r.SetBackground2(.09,.19,.22); self.r.GradientBackgroundOn()
            self.win=vtk.vtkRenderWindow(); self.win.SetOffScreenRendering(1); self.win.SetSize(W,H); self.win.SetMultiSamples(0); self.win.AddRenderer(self.r)
            self.r.AutomaticLightCreationOff()
            for p,i in [((-5,-8,10),1.05),((7,-1,6),.55),((1,6,7),.65)]:
             l=vtk.vtkLight(); l.SetLightTypeToSceneLight(); l.SetPosition(*p); l.SetFocalPoint(0,0,1); l.SetIntensity(i); self.r.AddLight(l)
            self.cam=self.r.GetActiveCamera(); self.cam.SetViewUp(0,0,1); self.cam.ParallelProjectionOn()
           def add(self,src,col,pos=(0,0,0),scale=(1,1,1),opacity=1):
            m=vtk.vtkPolyDataMapper(); m.SetInputConnection(src.GetOutputPort()); a=vtk.vtkActor(); a.SetMapper(m); a.SetPosition(*pos); a.SetScale(*scale); p=a.GetProperty(); p.SetColor(*col); p.SetOpacity(opacity); p.SetAmbient(.22); p.SetDiffuse(.75); p.SetSpecular(.28); p.SetSpecularPower(32); self.r.AddActor(a); return a
           def box(self,p,s,c,op=1):
            return self.add(vtk.vtkCubeSource(),c,p,s,op)
           def ball(self,p,r,c):
            q=vtk.vtkSphereSource(); q.SetRadius(r); q.SetThetaResolution(14); q.SetPhiResolution(10); return self.add(q,c,p)
           def axis(self,src,a,b,r,c,op=1):
            a,b=np.array(a,float),np.array(b,float); v=b-a; length=np.linalg.norm(v); u=v/length; ob=self.add(src,c,(a+b)/2,(r,length,r),op); axis=np.cross([0,1,0],u); ang=math.degrees(math.acos(np.clip(u[1],-1,1)))
            if np.linalg.norm(axis)>1e-8: ob.RotateWXYZ(ang,*axis)
            elif u[1]<0: ob.RotateX(180)
            return ob
           def cyl(self,a,b,r,c,op=1):
            q=vtk.vtkCylinderSource(); q.SetRadius(1); q.SetHeight(1); q.SetResolution(56); return self.axis(q,a,b,r,c,op)
           def arrow(self,a,b,c,r=.10):
            a,b=np.array(a,float),np.array(b,float); mid=a+(b-a)*.7; self.cyl(a,mid,r*.45,c); q=vtk.vtkConeSource(); q.SetDirection(0,1,0); q.SetRadius(1); q.SetHeight(1); q.SetResolution(24); self.axis(q,mid,b,r,c)
           def pipe(self,pts,r=.16,c=MET):
            for a,b in zip(pts,pts[1:]): self.cyl(a,b,r,c)
            for p in pts[1:-1]: self.ball(p,r,c)
           def flange(self,a,b,r):
            self.cyl(a,b,r,MET); self.cyl(a,b,r*.81,DARK)
           def wall(self,x0,x1,z0,z1,rad,theta0=0,theta1=180,c=MET):
            # open half-cylinder along x; y=rad*sin(theta), z=z0+rad*cos(theta), z1 unused
            points=vtk.vtkPoints(); cells=vtk.vtkCellArray(); n=64
            for i in range(n+1):
             t=math.radians(theta0+(theta1-theta0)*i/n)
             for x in (x0,x1): points.InsertNextPoint(x,rad*math.sin(t),z0+rad*math.cos(t))
            for i in range(n):
             q=vtk.vtkQuad()
             for k,j in enumerate((2*i,2*i+1,2*i+3,2*i+2)): q.GetPointIds().SetId(k,j)
             cells.InsertNextCell(q)
            pd=vtk.vtkPolyData(); pd.SetPoints(points); pd.SetPolys(cells); norm=vtk.vtkPolyDataNormals(); norm.SetInputData(pd); norm.ComputePointNormalsOn(); norm.SplittingOff(); return self.add(norm,c)
           def base(self):
            self.box((0,0,-.15),(8,4,.23),DARK)
            for x in np.linspace(-4,4,17): self.box((x,0,-.025),(.012,4,.012),(.25,.34,.36))
            for y in np.linspace(-2,2,9): self.box((0,y,-.025),(8,.012,.012),(.25,.34,.36))
           def render(self,name,subtitle,legend,target=(0,0,1),scale=5.2,eye=(5,-10,6)):
            self.spec=(name,subtitle,legend,np.array(target),scale,np.array(eye)); return self
           def capture(self,t,local,title,sub):
            name,subtitle,legend,target,scale,eye=self.spec; name=title or name; subtitle=sub or subtitle
            ang=.025*math.sin(local); x,y,z=eye; eye=np.array([x*math.cos(ang)-y*math.sin(ang),x*math.sin(ang)+y*math.cos(ang),z]); self.cam.SetPosition(*(target+eye)); self.cam.SetFocalPoint(*target); self.cam.SetParallelScale(scale*(1-.018*math.sin(local))); self.r.ResetCameraClippingRange()
            if not hasattr(self,'cap'):
             self.cap=vtk.vtkWindowToImageFilter(); self.cap.SetInput(self.win); self.cap.ReadFrontBufferOff()
            self.win.Render(); self.cap.Modified(); self.cap.Update(); im=Image.fromarray(np.flipud(vtk_to_numpy(self.cap.GetOutput().GetPointData().GetScalars()).reshape(H,W,3)).copy())
            layer=Image.new("RGBA",(540,960)); d=ImageDraw.Draw(layer); F=font
            d.text((26,26),'meanwhile',font=F(21),fill='#F5F5F5'); d.text((26+d.textlength('meanwhile',font=F(21)),26),'mash',font=F(21),fill='#C6FF00')
            fs=31
            while d.textlength(name,font=F(fs))>540-44: fs-=1
            d.text((270,94),name,font=F(fs),fill='white',anchor='mm'); d.text((270,130),subtitle,font=F(17),fill='#B6D4D8',anchor='mm')
            for i,(label,c) in enumerate(legend):
             yy=765+i*35; d.rounded_rectangle((32,yy,49,yy+17),4,fill=tuple(int(k*255) for k in c)); d.text((61,yy+8),label,font=F(18),fill='white',anchor='lm')
            if t>=38.97:
             q=min(1,(t-38.97)/.30); y=695+25*(1-q); d.rounded_rectangle((105,y,435,y+48),12,fill="#C6FF00"); d.text((270,y+24),"SUBSCRIBE  •  meanwhilemash",font=F(19),fill="#101820",anchor="mm")
            im.paste(layer.resize((W,H),Image.Resampling.LANCZOS),(0,0),layer.resize((W,H),Image.Resampling.LANCZOS)); return im

          @lru_cache(None)
          def font(n): return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',n)

          def arrows(s,points,c,r=.09):
           for a,b in points: s.arrow(a,b,c,r)
          def frame(i):
           random.seed(5); s=Scene(); s.base(); s.blades=[]; s.debris=[]; s.minerals=[]; s.uv=[]; s.glass=None; s.jet=None
           if i==1:
            s.box((-2.6,0,.16),(3.1,3.7,.30),BLUE)
            for x in np.linspace(-3.9,-1.3,6):
             for y in [-1.2,-.3,.6,1.5]: s.box((x,y,.33),(.36,.045,.025),CLEAN)
            s.box((1.4,0,.26),(4.2,3.7,.5),SAND)
            s.pipe([(-2.8,0,.22),(-1.8,0,.22),(-1.8,0,.88),(.4,0,.88)],.18)
            s.cyl((-3.1,0,.22),(-2.8,0,.22),.34,MET)
            for y in np.linspace(-.24,.24,7): s.cyl((-3.16,y,.03),(-3.16,y,.42),.018,DARK)
            s.box((1.18,0,1.1),(1.4,1.6,1.2),MET); s.box((1.18,0,1.78),(1.6,1.8,.14),DARK)
            for x in [.75,1.22,1.69]: s.box((x,-.82,1.18),(.24,.035,.34),BLUE)
            s.pipe([(1.9,0,.86),(3.5,0,.86)],.16)
            arrows(s,[((-3.8,-.0,.45),(-3.2,0,.45)),((-1.7,-.43,1.02),(-.35,-.43,1.02)),((2.1,-.36,1),(3.3,-.36,1))],CLEAN)
            return s.render('SEAWATER INTAKE','Screened intake → treatment plant',[('Ocean water enters screened pipe',BLUE),('Flow direction',CLEAN)],scale=7.2,eye=(4,-12,8))
           if i==2:
            # front wall removed; real layered media, water above and collection below.
            x0=-1.4; x1=1.4
            s.box((0,.84,1.9),(3,.18,3.5),MET); s.box((-1.5,0,1.9),(.18,1.8,3.5),MET); s.box((1.5,0,1.9),(.18,1.8,3.5),MET); s.box((0,0,.20),(3,1.8,.18),MET)
            for z,h,c in [(.56,.40,BLUE),(1.00,.40,DARK),(1.46,.48,SAND),(1.99,.57,(.39,.29,.20)),(2.73,.88,BLUE)]: s.box((0,0,z),(2.8,1.6,h),c,.76 if c==BLUE else 1)
            for k in range(125):
             x=random.uniform(-1.3,1.3); z=random.uniform(1.22,1.69); s.ball((x,-.83,z),random.uniform(.028,.055),(.91,.76,.52))
            for k in range(70): s.ball((random.uniform(-1.3,1.3),-.84,random.uniform(1.73,2.25)),random.uniform(.04,.075),(.53,.39,.24))
            for k in range(26): s.debris.append(s.ball((random.uniform(-1.3,1.3),-.86,random.uniform(2.31,3.04)),random.uniform(.035,.10),SALT))
            for x in [-.85,0,.85]: s.arrow((x,-.94,2.98),(x,-.94,1.15),CLEAN,.11); s.arrow((x,-.94,.95),(x,-.94,.46),CLEAN,.08)
            s.pipe([(-3.2,0,3.20),(0,0,3.20),(0,0,3.00)],.19); s.pipe([(1.50,0,.56),(3.1,0,.56)],.20); s.arrow((1.65,-.35,.60),(3.05,-.35,.60),CLEAN)
            return s.render('MEDIA FILTRATION','Cutaway of a granular filter',[('Debris retained above media',SALT),('Anthracite / sand layers',SAND),('Filtered feed water (still salty)',CLEAN)],target=(0,0,1.8),scale=6.2,eye=(2,-12,4.5))
           if i==3:
            # centrifugal pump cutaway, front axis along y; exposed impeller blades
            s.box((0,0,.25),(3.7,2.4,.35),MET); s.cyl((0,.75,1.75),(0,-.10,1.75),1.25,MET); s.cyl((0,-.11,1.75),(0,-.22,1.75),1.08,DARK)
            s.cyl((0,-.23,1.75),(0,-.42,1.75),.92,BLUE)
            for j in range(7):
             a=j*2*math.pi/7
             for k in range(9):
              u=k/9; v=(k+1)/9
              def pt(t):
               r=.25+.65*t; th=a+.8*t; return (r*math.cos(th),-.50,1.75+r*math.sin(th))
              s.blades.append(s.cyl(pt(u),pt(v),.075,MET))
            s.cyl((0,-.73,1.75),(0,-.44,1.75),.32,CLEAN)
            s.pipe([(0,-2.0,1.75),(0,-.73,1.75)],.29); s.pipe([(0,.12,2.95),(0,.12,3.45),(2.8,.12,3.45)],.25)
            for x in np.linspace(-.7,.7,5): s.box((x,1.17,1.75),(.08,.4,1.35),DARK)
            s.cyl((0,.77,1.75),(0,1.55,1.75),.70,DARK); s.arrow((.45,-1.85,1.75),(.45,-.85,1.75),CLEAN,.13); s.arrow((.45,-.25,3.55),(2.6,-.25,3.55),LIME,.15)
            return s.render('HIGH-PRESSURE PUMP','Exposed centrifugal impeller',[('Filtered feed enters at center',CLEAN),('Pressurized feed to RO vessels',LIME)],target=(.2,0,1.8),scale=5.5,eye=(3,-12,4))
           if i==4:
            # Flat-sheet schematic, expanded channels. Feed travels horizontally, permeate down.
            s.box((0,.67,1.22),(5.8,.08,2.25),MET)
            # remove front side rail above transparent liquid to make cross-section readable
            s.box((0,0,.30),(5.9,1.4,.17),MET); s.box((0,0,2.42),(5.9,1.4,.14),MET)
            s.box((0,0,1.92),(5.65,1.15,.78),BLUE,.42); s.box((0,0,.59),(5.65,1.15,.40),CLEAN,.52)
            s.box((0,0,1.17),(5.8,1.38,.11),LIME)
            for x in np.linspace(-2.65,2.65,25): s.box((x,0,1.02),(.045,1.28,.14),MET)
            for x in [-2.3,-1.3,-.3,.7,1.7]:
             s.arrow((x,-.1,1.8),(x+.65,-.1,1.8),BLUE,.09); s.arrow((x,-.10,1.67),(x,-.10,.62),CLEAN,.085)
             for z in [2.02,2.18]: s.ball((x,.12,z),.085,SALT)
             s.ball((x+.33,-.12,1.52),.055,CLEAN); s.ball((x+.23,-.06,.58),.055,CLEAN)
            s.pipe([(-3.8,0,1.9),(-2.9,0,1.9)],.23); s.pipe([(2.9,0,1.9),(3.8,0,1.9)],.23); s.pipe([(2.9,0,.59),(3.8,0,.59)],.18)
            s.arrow((3.0,-.36,1.9),(3.8,-.36,1.9),SALT); s.arrow((3.0,-.36,.59),(3.8,-.36,.59),CLEAN)
            # front side rail hidden to reveal interior
            return s.render('REVERSE OSMOSIS','Expanded membrane cross-section (schematic)',[('Salt-rich feed travels along membrane',SALT),('Selective membrane rejects most salts',LIME),('Permeate passes through membrane',CLEAN)],target=(0,0,1.2),scale=7.3,eye=(1,-12,5))
           if i==5:
            # actual spiral cartridge, opened casing with spiral leaves; central collector
            s.wall(-2.65,2.65,1.65,0,1.12,c=MET)
            s.wall(-2.72,-2.51,1.65,0,1.17,c=MET); s.wall(2.51,2.72,1.65,0,1.17,c=MET)
            s.cyl((-3.25,0,1.65),(3.45,0,1.65),.16,CLEAN)
            for x in np.linspace(-2.5,2.5,30):
             for a in [0,math.pi/2,math.pi,math.pi*1.5]: s.ball((x,.167*math.cos(a),1.65+.167*math.sin(a)),.035,DARK)
            # rolled membrane layers rendered as connected strips along length, cut away near viewer
            for j in range(4):
             pts=vtk.vtkPoints(); cells=vtk.vtkCellArray(); N=100
             for k in range(N+1):
              q=k/N; ang=q*math.pi*4+j*math.pi/2; r=.22+.76*q
              for x in [-2.46,2.46]: pts.InsertNextPoint(x,r*math.cos(ang),1.65+r*math.sin(ang))
             for k in range(N):
              if (k//12)%2==1: continue
              cell=vtk.vtkQuad()
              for a,b in enumerate([2*k,2*k+1,2*k+3,2*k+2]): cell.GetPointIds().SetId(a,b)
              cells.InsertNextCell(cell)
             pd=vtk.vtkPolyData(); pd.SetPoints(pts); pd.SetPolys(cells); n=vtk.vtkPolyDataNormals(); n.SetInputData(pd); s.add(n,LIME if j%2==0 else MET,opacity=.85)
            s.pipe([(-3.7,0,2.25),(-2.65,0,2.25)],.23); s.pipe([(2.65,0,2.25),(3.7,0,2.25)],.22); s.arrow((-3.8,-.45,2.3),(-2.7,-.45,2.3),BLUE); s.arrow((2.7,-.45,2.3),(3.8,-.45,2.3),SALT); s.arrow((2.7,-.45,1.5),(3.8,-.45,1.5),CLEAN)
            return s.render('SPIRAL-WOUND MODULE','Opened pressure vessel • separate outlets',[('Feed enters through outer channels',BLUE),('Concentrated brine exits end port',SALT),('Permeate collects in central tube',CLEAN)],target=(0,0,1.65),scale=7.0,eye=(5,-12,3.5))
           if i==6:
            for x in [-1.7,1.7]:
             s.box((x,.7,1.26),(2.15,.12,2.4),MET); s.box((x-1.02,0,1.26),(.12,1.5,2.4),MET); s.box((x+1.02,0,1.26),(.12,1.5,2.4),MET); s.box((x,0,.18),(2.2,1.5,.20),MET); s.box((x,0,.9),(1.9,1.3,1.32),CLEAN,.55)
            s.pipe([(-3.55,0,.8),(-2.75,0,.8)],.15); s.pipe([(-.7,0,.8),(.7,0,.8)],.16); s.pipe([(2.75,0,.8),(3.65,0,.8)],.16)
            s.cyl((-1.7,0,2.65),(-1.7,0,3.16),.42,MET); s.pipe([(-1.7,0,2.65),(-1.7,0,1.54)],.08)
            for j in range(15): s.minerals.append(s.ball((-1.7+random.uniform(-.23,.23),random.uniform(-.25,.25),random.uniform(1.4,2.58)),.047,LIME))
            for x in [1.15,1.53,1.91,2.29]: s.uv.append(s.cyl((x,-.3,.45),(x,-.3,1.43),.075,(.72,.48,1))); s.cyl((x,-.3,.42),(x,-.3,.53),.10,MET)
            s.arrow((-.6,-.30,.85),(.6,-.30,.85),CLEAN); s.arrow((2.8,-.30,.85),(3.6,-.30,.85),CLEAN)
            return s.render('FINAL WATER TREATMENT','Mineral adjustment → disinfection',[('Minerals added to conditioned water',LIME),('UV shown as one disinfection option',(.72,.48,1)),('Treated drinking water',CLEAN)],target=(0,0,1.5),scale=7.0,eye=(2,-12,5))
           if i==7:
            # recognizable house, pitched roof and open ground distribution trench
            for x in [-1.8,1.6]:
             s.box((x,.63,1.0),(2.35,2,1.9),WHITE)
             for k in [-1,1]:
              a=s.box((x+k*.59,.63,2.12),(1.37,2.3,.16),DARK); a.RotateY(k*32)
             s.box((x,-.39,.65),(.45,.055,1.18),DARK)
             for dx in [-.78,.78]: s.box((x+dx,-.41,1.18),(.50,.06,.56),BLUE)
            s.pipe([(-3.8,-1.45,.23),(3.25,-1.45,.23)],.18,BLUE)
            for x in [-1.8,1.6]: s.pipe([(x,-1.45,.23),(x,-.65,.23),(x,-.65,.75)],.13,BLUE)
            for x in [-3.3,-.6,1.9]: s.arrow((x,-1.76,.27),(x+.75,-1.76,.27),CLEAN)
            for x in [-1.8,1.6]: s.arrow((x+.25,-1.37,.28),(x+.25,-.67,.28),CLEAN)
            return s.render('DISTRIBUTION TO HOMES','Pressurized mains and service lines',[('Drinking water main',BLUE),('Flow to household connections',CLEAN)],target=(0,0,1.0),scale=7.0,eye=(3,-12,7))
           # faucet, clear glass with real cylindrical water surface; half shell readable
           s.box((0,.4,.70),(4,2.6,1.35),MET); s.box((0,.4,1.45),(4.2,2.8,.17),WHITE)
           s.pipe([(-.85,.7,1.55),(-.85,.7,3.16),(-.85,-.68,3.16),(-.1,-.68,3.16),(-.1,-.68,2.97)],.14,MET)
           s.cyl((-.15,-.68,1.55),(-.15,-.68,2.55),.49,(.64,.88,.95),.24)
           s.glass=s.cyl((-.15,-.68,1.59),(-.15,-.68,2.18),.43,CLEAN,.68)
           s.jet=s.cyl((-.10,-.68,2.2),(-.10,-.68,2.95),.07,CLEAN,.8)
           for k in range(12): s.ball((-.10+random.uniform(-.13,.13),-.68+random.uniform(-.1,.1),2.19+random.uniform(0,.12)),.036,WHITE)
           return s.render('FROM OCEAN TO GLASS','Fresh drinking water at the tap',[('Desalinated and conditioned water',CLEAN)],target=(0,0,1.8),scale=4.9,eye=(4,-12,5))


          CUES=[(0,8,'OCEAN TO DRINKING WATER','From seawater to a glass of fresh water'),(4.003,1,None,None),(7.039,2,None,None),(10.517,3,None,None),(13.682,5,'MEMBRANE MODULE','High-pressure feed enters the membrane'),(14.928,4,'MOLECULAR SEPARATION',None),(19.845,4,'REVERSE OSMOSIS',None),(22.692,5,'BRINE SEPARATION','Concentrated salty water leaves separately'),(25.277,6,None,None),(29.029,7,None,None),(33.448,8,None,None),(37.274,8,None,None)]
          D=41.404063

          def setup(i):
           s=frame(i); s.streams=[]
           def flow(pts,n,c=CLEAN,r=.05,speed=.65):
            p=np.array(pts,float); lengths=np.linalg.norm(np.diff(p,axis=0),axis=1); cum=np.r_[0,np.cumsum(lengths)]; s.streams.append(([s.ball(p[0],r,c) for _ in range(n)],p,lengths,cum,speed))
