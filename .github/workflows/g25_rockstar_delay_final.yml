# MeanwhileMash G25 | Enhanced 2.5D | GTA VI-inspired palette
# Original visuals only. No official GTA artwork, logos, gameplay, maps or character assets.
# GTA-inspired palette is approximate and stylistic, not official brand color data.
name: MeanwhileMash - G25 Rockstar Delay Mystery

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Match ElevenLabs narration duration (20-60 seconds)"
        required: true
        default: "44"
      quality:
        description: "Render resolution"
        type: choice
        options:
          - preview
          - full
        default: preview

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] && [ ! -f /usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Render video and synchronized SFX
        env:
          DURATION: ${{ inputs.duration }}
          QUALITY: ${{ inputs.quality }}
        run: |
          cat > render.py <<'PYCODE'
          import argparse, math, subprocess, wave
          from functools import lru_cache
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          p = argparse.ArgumentParser()
          p.add_argument("--duration", type=float, default=44)
          p.add_argument("--width", type=int, default=432)
          p.add_argument("--output", default="G25.mp4")
          a = p.parse_args()

          D = a.duration
          W = a.width
          H = W * 16 // 9
          H -= H % 2
          S = W / 720
          FPS = 30
          SR = 48000

          assert 20 <= D <= 60, "Duration must be 20-60 seconds"

          # MeanwhileMash brand
          LIME = "#C6FF00"
          WHITE = "#F5F5F5"
          SLATE = "#64748B"

          # GTA VI-inspired palette
          NAVY   = "#131629"
          PURPLE = "#7B4DDA"
          PINK   = "#FF5EA5"
          ORANGE = "#FFB166"
          CYAN   = "#57C7FF"
          DEEP   = "#1E233C"
          PANEL  = "#1C2336"
          STEEL  = "#51657A"
          SOFT   = "#9DB0BE"
          RED    = "#D97A74"
          SHADOW = "#0B1018"

          B = [0, 4.5, 9, 14, 19, 24, 29, 35, 40, 45, 49, 54]
          HEAD = [
            ("13 YEARS.", "ON PURPOSE?"),
            ("IT STARTED", "BACK IN 2013"),
            ("ONE GAME", "KEPT EARNING"),
            ("THE THEORY", "FOLLOW THE MONEY"),
            ("THE MONEY MACHINE", "KEPT RUNNING"),
            ("THE SILENCE", "BUILT ANTICIPATION"),
            ("BUT HERE IS", "THE OTHER SIDE"),
            ("THE EVIDENCE", "HAS A LIMIT"),
            ("NOVEMBER 19", "2026 — RELEASED"),
            ("WAIT...", "OR STRATEGY?"),
            ("STAY CURIOUS", "GET UPDATED"),
          ]
          FOOT = [
            "QUESTION, NOT A FACT",
            "GTA V: SEPTEMBER 2013",
            "GTA ONLINE / ONGOING BUSINESS",
            "HYPOTHESIS, NOT VERIFIED",
            "NO REVENUE TOTAL ASSUMED",
            "ATTENTION IS NOT PROOF",
            "LONG DEVELOPMENT IS REAL",
            "NO EVIDENCE OF DELIBERATE DELAY",
            "RELEASE CONFIRMED BY ROCKSTAR",
            "THE MOTIVE IS UNKNOWN",
            "SUBSCRIBE FOR MORE",
          ]

          def clamp(x): return max(0, min(1, x))
          def ease(x):
              x = clamp(x)
              return x * x * (3 - 2 * x)

          def anim(q, start, dur):
              return ease((q - start) / dur)

          def P(x, y):
              return (round(x * S), round(y * S))

          @lru_cache(None)
          def font(sz):
              for path in [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
              ]:
                  try:
                      return ImageFont.truetype(path, max(10, round(sz * S)))
                  except OSError:
                      pass
              raise RuntimeError("No suitable font found")

          def tx(d, x, y, text, size=30, color=WHITE, anchor="mm", maxw=650):
              while size > 12 and font(size).getlength(text) > maxw * S:
                  size -= 1
              d.text(P(x, y), text, font=font(size), fill=color, anchor=anchor)

          def rect(d, x, y, w, h, fill, r=0, outline=None, sw=1):
              d.rounded_rectangle(
                  [P(x, y), P(x + w, y + h)],
                  radius=max(0, round(r * S)),
                  fill=fill,
                  outline=outline,
                  width=max(1, round(sw * S)),
              )

          def line(d, pts, fill, w=2):
              d.line([P(*pt) for pt in pts], fill=fill, width=max(1, round(w * S)), joint="curve")

          def ell(d, x, y, rx, ry, fill=None, outline=None, sw=1):
              d.ellipse(
                  [P(x - rx, y - ry), P(x + rx, y + ry)],
                  fill=fill,
                  outline=outline,
                  width=max(1, round(sw * S)),
              )

          def poly(d, pts, fill):
              d.polygon([P(*pt) for pt in pts], fill=fill)

          def hex_rgb(h):
              return tuple(int(h[i:i+2], 16) for i in (1, 3, 5))

          def rgb_hex(rgb):
              return "#" + "".join(f"{max(0,min(255,int(v))):02x}" for v in rgb)

          def blend(a, b, t):
              aa = hex_rgb(a)
              bb = hex_rgb(b)
              return rgb_hex(tuple(round(aa[i] + (bb[i] - aa[i]) * t) for i in range(3)))

          def cuboid(d, x, y, w, h, dep, front, top, side):
              poly(d, [(x, y-h), (x+dep, y-h-dep*.36), (x+w+dep, y-h-dep*.36), (x+w, y-h)], top)
              poly(d, [(x+w, y-h), (x+w+dep, y-h-dep*.36), (x+w+dep, y-dep*.36), (x+w, y)], side)
              rect(d, x, y-h, w, h, front, 3)
              line(d, [(x, y-h), (x+w, y-h), (x+w+dep, y-h-dep*.36)], blend(top, WHITE, .2), 1)

          def sunset_background():
              y = np.linspace(0, 1, H)[:, None]
              x = np.linspace(0, 1, W)[None, :]
              top = np.array(hex_rgb(NAVY), dtype=np.float32)
              mid = np.array(hex_rgb(PURPLE), dtype=np.float32)
              pink = np.array(hex_rgb(PINK), dtype=np.float32)
              orange = np.array(hex_rgb(ORANGE), dtype=np.float32)

              img = np.zeros((H, W, 3), dtype=np.float32)
              upper = np.clip((0.45 - y) / 0.45, 0, 1)
              lower = np.clip((y - 0.45) / 0.55, 0, 1)
              img = top * upper[..., None] + mid * (1 - upper[..., None])
              img = img * (1 - lower[..., None]) + pink * lower[..., None]
              glow = np.exp(-(((x - .72) / .18) ** 2 + ((y - .28) / .12) ** 2))
              img += glow[..., None] * (orange - img) * 0.85
              vignette = np.clip(1 - np.sqrt(((x - .5) * 1.2) ** 2 + ((y - .54) * 1.05) ** 2), 0, 1) ** 1.4
              img = img * (0.55 + 0.45 * vignette[..., None])
              return Image.fromarray(np.uint8(np.clip(img, 0, 255)))

          BASE = sunset_background()

          def skyline(d, phase, ground=875):
              # stylized city layers with GTA-inspired atmosphere
              for layer in range(3):
                  step = 52 if layer == 0 else 68 if layer == 1 else 96
                  shift = (phase * 9 * (layer + 1)) % step
                  col = [blend(NAVY, PURPLE, .30), blend(PURPLE, PINK, .22), blend(DEEP, CYAN, .18)][layer]
                  bottom = 740 + layer * 58
                  for j in range(-2, 14):
                      x = j * step - shift
                      h = 90 + ((j * 43 + layer * 29) % 190)
                      rect(d, x, bottom - h, step - 8, h, col, 2)
                      if layer > 0:
                          for yy in range(3):
                              for xx in range(2):
                                  if (j + yy + xx) % 3:
                                      rect(d, x + 10 + xx * 18, bottom - h + 17 + yy * 28, 6, 9, blend(ORANGE, WHITE, .18), 2)
              # sun
              ell(d, 592, 201, 92, 92, fill=blend(ORANGE, WHITE, .08))
              ell(d, 592, 201, 79, 79, fill=ORANGE)
              for k in range(5):
                  ell(d, 592, 201, 94 + k * 20, 94 + k * 20, outline=blend(PINK, ORANGE, .5), sw=1)

              line(d, [(0, ground), (720, ground)], blend(PURPLE, CYAN, .35), 2)
              for j in range(-7, 8):
                  line(d, [(360 + j * 28, ground), (360 + j * 150, 1130)], blend(NAVY, CYAN, .18), 1)
              for yy in [900, 943, 1002, 1090]:
                  line(d, [(0, yy), (720, yy)], blend(NAVY, CYAN, .22), 1)

          def glow_ring(d, x, y, r, col=PINK):
              for j in range(4, 0, -1):
                  ell(d, x, y, r * (0.35 + 0.15 * j), r * (0.35 + 0.15 * j), outline=blend(col, WHITE, .2), sw=1)

          def money_bundle(d, x, y, w=54, h=31, dep=12):
              cuboid(d, x, y, w, h, dep, blend(ORANGE, PURPLE, .35), blend(ORANGE, WHITE, .25), blend(PURPLE, NAVY, .35))
              rect(d, x + w * .40, y - h, w * .20, h, blend(PINK, ORANGE, .35), 2)

          def paper_card(d, x, y, w, h, title, value):
              rect(d, x + 8, y + 10, w, h, SHADOW, 9)
              rect(d, x, y, w, h, "#E7E8DE", 8)
              rect(d, x, y, w, 24, blend(PINK, ORANGE, .35), 8)
              tx(d, x + w/2, y + 46, title, 16, NAVY, maxw=w - 15)
              tx(d, x + w/2, y + h * .68, value, 28, blend(PURPLE, NAVY, .25), maxw=w - 12)

          def signal(d, pts, phase, col=CYAN):
              line(d, pts, blend(PURPLE, NAVY, .35), 3)
              lens = [math.dist(a, b) for a, b in zip(pts, pts[1:])]
              target = clamp(phase) * sum(lens)
              for j, seg in enumerate(lens):
                  if target <= seg or j == len(lens) - 1:
                      f = clamp(target / seg)
                      ax, ay = pts[j]
                      bx, by = pts[j + 1]
                      px = ax + (bx - ax) * f
                      py = ay + (by - ay) * f
                      ell(d, px, py, 6, 6, fill=col)
                      ell(d, px, py, 12, 12, outline=col, sw=2)
                      break
                  target -= seg

          def draw_scene(t):
              i = next((k for k in range(len(B)-1) if t < B[k+1]), len(B)-2)
              q = t - B[i]
              im = BASE.copy()
              d = ImageDraw.Draw(im)

              if i == 0:
                  skyline(d, q, 855)
                  rect(d, 113, 366, 494, 360, SHADOW, 24, outline=blend(PINK, CYAN, .35), sw=2)
                  rect(d, 129, 382, 462, 327, PANEL, 18)
                  for j in range(13):
                      xx = 144 + j * 33
                      f = anim(q, j * .105, .4)
                      rect(d, xx, 649 - 105 * f, 17, 55 + 105 * f, blend(PURPLE, CYAN, .18), 3)
                  tx(d, 360, 455, "13", 118, ORANGE)
                  tx(d, 360, 548, "YEARS", 56, WHITE)
                  rect(d, 150, 610, 420, 8, blend(PURPLE, CYAN, .22), 3)
                  rect(d, 150, 610, 420 * anim(q, .4, 2), 8, PINK, 3)
                  glow_ring(d, 360, 774, 28, ORANGE)
                  tx(d, 360, 984, "WHO BENEFITED FROM THE WAIT?", 26, WHITE)

              elif i == 1:
                  skyline(d, q, 950)
                  cuboid(d, 115, 782, 157, 260, 23, blend(PURPLE, NAVY, .20), blend(PINK, WHITE, .15), blend(NAVY, CYAN, .22))
                  tx(d, 193, 647, "V", 98, ORANGE)
                  cuboid(d, 449, 782, 157, 260, 23, blend(PINK, PURPLE, .15), blend(ORANGE, WHITE, .15), blend(PURPLE, NAVY, .30))
                  tx(d, 526, 647, "VI", 94, ORANGE)
                  f = anim(q, .55, 2.7)
                  line(d, [(190, 847), (530, 847)], blend(PURPLE, CYAN, .20), 5)
                  line(d, [(190, 847), (190 + 340 * f, 847)], PINK, 5)
                  for j in range(14):
                      xx = 190 + j * 340 / 13
                      ell(d, xx, 847, 5.5, 5.5, fill=PINK if j / 13 <= f else blend(PURPLE, CYAN, .25))
                  year = 2013 + int(13 * f)
                  tx(d, 360, 944, str(year), 47, ORANGE)
                  tx(d, 193, 1030, "2013", 22, WHITE)
                  tx(d, 526, 1030, "2026", 22, WHITE)

              elif i == 2:
                  skyline(d, q, 985)
                  cuboid(d, 184, 924, 360, 465, 52, blend(PURPLE, NAVY, .25), blend(PINK, WHITE, .12), blend(NAVY, CYAN, .22))
                  rect(d, 209, 481, 310, 225, blend(NAVY, PURPLE, .18), 18, outline=blend(PINK, CYAN, .18), sw=2)
                  tx(d, 364, 540, "ONLINE", 43, PINK)
                  for j in range(5):
                      xx = 234 + j * 55
                      rect(d, xx, 590, 32, 80, blend(PURPLE, CYAN, .10), 5)
                      if j < round(5 * anim(q, .2, 1.8)):
                          rect(d, xx + 7, 604, 18, 53, ORANGE, 2)
                  rect(d, 260, 745, 208, 19, blend(PURPLE, CYAN, .18), 7)
                  for j in range(5):
                      f = anim(q, .45 + j * .65, .45)
                      if f:
                          yy = 771 + j * 40 - 28 * f
                          money_bundle(d, 264, yy + 29, 203, 30, 14)
                          tx(d, 366, yy + 13, "$$   $$   $$", 16, WHITE)
                  tx(d, 360, 1038, "RECURRING BUSINESS MODEL", 22, CYAN)

              elif i == 3:
                  rect(d, 38, 355, 644, 558, blend(NAVY, ORANGE, .10), 20, outline=blend(PINK, ORANGE, .18), sw=2)
                  for j in range(8):
                      line(d, [(50, 400 + j * 69), (670, 400 + j * 69)], blend(PURPLE, ORANGE, .12), 2)
                  cards = [
                      (67, 424, "GTA ONLINE", "REVENUE"),
                      (394, 413, "GTA VI", "LONG WAIT"),
                      (212, 694, "THEORY", "PROFIT MOTIVE"),
                  ]
                  for j, (x, y, title, value) in enumerate(cards):
                      f = anim(q, .2 + j * .9, .5)
                      if f:
                          paper_card(d, x, y - (1 - f) * 38, 255, 173, title, value)
                  p = [(194, 578), (522, 569), (337, 706), (194, 578)]
                  for j in range(3):
                      f = anim(q, 1 + j * .72, .44)
                      if f:
                          line(d, [p[j], (p[j][0] + (p[j+1][0] - p[j][0]) * f, p[j][1] + (p[j+1][1] - p[j][1]) * f)], PINK, 3)
                  rect(d, 76, 278, 568, 45, blend(NAVY, PINK, .22), 12)
                  tx(d, 360, 302, "SPECULATION • NOT EVIDENCE", 19, ORANGE)

              elif i == 4:
                  skyline(d, q, 1000)
                  cuboid(d, 95, 874, 537, 177, 43, blend(PURPLE, NAVY, .20), blend(PINK, WHITE, .10), blend(NAVY, CYAN, .22))
                  rect(d, 105, 842, 516, 28, blend(NAVY, CYAN, .18), 9)
                  for j in range(9):
                      x = 110 + ((j * 74 + q * 75) % 510)
                      ell(d, x, 856, 8, 8, fill=blend(PINK, CYAN, .30))
                  for j in range(6):
                      f = anim(q, .30 + j * .70, .38)
                      if f:
                          x = 111 + (j * 74 + q * 56) % 470
                          money_bundle(d, x, 828, 55, 35 + 24 * f, 12)
                          tx(d, x + 27, 802 - 17 * f, "$", 20, ORANGE)
                  tx(d, 360, 960, "STEADY BUSINESS", 26, PINK)
                  tx(d, 360, 1018, "NOT PROOF OF A DELAY", 19, WHITE)

              elif i == 5:
                  skyline(d, q, 970)
                  f = anim(q, .25, 3.3)
                  year = 2013 + int(13 * f)
                  cuboid(d, 196, 822, 335, 365, 26, blend(PURPLE, NAVY, .18), blend(PINK, WHITE, .10), blend(NAVY, CYAN, .18))
                  rect(d, 219, 480, 287, 317, "#EFEADE", 8)
                  rect(d, 219, 480, 287, 69, blend(PINK, ORANGE, .38), 8)
                  tx(d, 362, 515, "YEAR", 28, NAVY)
                  tx(d, 362, 659, str(year), 83, NAVY)
                  for j in range(3):
                      k = anim(q, 1.4 + j * .75, .42)
                      if k:
                          poly(d, [(487, 776), (487 - 110 * k, 776 - 20 * k), (487 - 113 * k, 730 - 32 * k), (487, 725)], blend(PINK, ORANGE, .22))
                  tx(d, 360, 921, "SILENCE MADE ROOM", 26, WHITE)
                  tx(d, 360, 970, "FOR SPECULATION", 27, ORANGE)

              elif i == 6:
                  skyline(d, q, 965)
                  cuboid(d, 76, 916, 574, 117, 35, blend(PURPLE, NAVY, .16), blend(PINK, WHITE, .10), blend(NAVY, CYAN, .16))
                  for j in range(6):
                      h = [102, 170, 129, 225, 150, 190][j]
                      xx = 121 + j * 77
                      f = anim(q, .3 + j * .72, .7)
                      if f:
                          cuboid(d, xx, 785, 58, h * f, 19, blend(CYAN, NAVY, .20), blend(CYAN, WHITE, .10), blend(NAVY, CYAN, .15))
                          for k in range(3):
                              if h * f > 40 + k * 31:
                                  rect(d, xx + 10, 785 - h * f + 18 + k * 31, 11, 10, blend(ORANGE, WHITE, .15), 2)
                  f = anim(q, .2, 4.5)
                  line(d, [(360, 333), (360 + 170 * f, 333)], ORANGE, 5)
                  rect(d, 360 + 170 * f, 320, 24, 28, PINK, 5)
                  tx(d, 360, 997, "COMPLEX DEVELOPMENT", 25, PINK)

              elif i == 7:
                  poly(d, [(360, 401), (393, 453), (327, 453)], blend(CYAN, WHITE, .12))
                  rect(d, 346, 450, 28, 370, blend(PURPLE, CYAN, .18), 8)
                  line(d, [(165, 530), (555, 530)], blend(CYAN, WHITE, .18), 10)
                  cols = [(188, "KNOWN", "LONG DEVELOPMENT"), (532, "UNKNOWN", "INTENT")]
                  for j, (x, label, body) in enumerate(cols):
                      f = anim(q, .25 + j * 1, .75)
                      ell(d, x, 755, 155, 14, fill=SHADOW)
                      line(d, [(x, 530), (x, 645)], blend(PURPLE, CYAN, .18), 4)
                      rect(d, x - 120, 648, 240 * f, 124, blend(NAVY, PURPLE, .22), 13)
                      if f > .6:
                          tx(d, x, 686, label, 23, PINK if j == 0 else ORANGE)
                          tx(d, x, 727, body, 15, WHITE, maxw=210)
                  tx(d, 360, 889, "NO PROOF OF INTENTIONAL DELAY", 22, RED)

              elif i == 8:
                  skyline(d, q, 995)
                  f = anim(q, .45, 1.9)
                  cuboid(d, 110, 900, 504, 490 * (1 - f) + 18, 35, blend(PURPLE, NAVY, .22), blend(PINK, WHITE, .10), blend(NAVY, CYAN, .20))
                  tx(d, 360, 521, "NOV 19", 62, ORANGE)
                  tx(d, 360, 630, "2026", 112, WHITE)
                  for j in range(7):
                      ell(d, 160 + j * 65, 850 - 250 * anim(q, .65 + j * .2, 1.7), 6, 6, fill=PINK)
                  tx(d, 360, 1015, "OFFICIAL RELEASE DATE", 25, CYAN)

              elif i == 9:
                  skyline(d, q, 965)
                  ell(d, 360, 610, 218, 218, fill=blend(NAVY, PURPLE, .22), outline=blend(PINK, CYAN, .20), sw=2)
                  for j in range(4):
                      ell(d, 360, 610, 73 + j * 43, 73 + j * 43, outline=blend(PURPLE, CYAN, .20), sw=1)
                  tx(d, 360, 575, "?", 150, ORANGE)
                  tx(d, 360, 743, "MOTIVE UNKNOWN", 25, WHITE)
                  rect(d, 76, 278, 568, 45, blend(NAVY, PINK, .20), 12)
                  tx(d, 360, 302, "THE THEORY IS STILL A THEORY", 19, ORANGE)
                  tx(d, 360, 1012, "ANTICIPATION HAS REAL VALUE", 22, PINK)

              else:
                  # Smooth CTA while preserving MeanwhileMash branding
                  u = q
                  r = 220 + 24 * math.sin(min(1, u / 1.4) * math.pi)
                  ell(d, 360, 590, r, r, outline=PINK, sw=2)
                  ell(d, 360, 590, r * .82, r * .82, outline=blend(PURPLE, CYAN, .25), sw=2)
                  tx(d, 360, 357, "THE STORY CONTINUES", 29, WHITE)
                  shift = 20 * (1 - anim(u, 0, .9))
                  px = 360 - (font(43).getlength("meanwhile") + font(43).getlength("mash")) / (2 * S)
                  tx(d, px, 548 + shift, "meanwhile", 43, WHITE, "lm")
                  tx(d, px + font(43).getlength("meanwhile") / S, 548 + shift, "mash", 43, LIME, "lm")
                  f = anim(u, 1.0, .65)
                  w = max(2, 396 * f)
                  y = 668 + 24 * (1 - f)
                  rect(d, 360 - w / 2, y, w, 76, blend(PURPLE, NAVY, .10), 38)
                  rect(d, 360 - w / 2, y - 5, w, 76, LIME, 38)
                  if f > .57:
                      tx(d, 360, y + 32, "SUBSCRIBE", 34, NAVY, maxw=w - 20)
                  if u >= 3.5:
                      j = anim(u, 3.5, .85)
                      ell(d, 360, y + 34, 210 + 35 * j, 42 + 22 * j, outline=LIME, sw=2)
                  tx(d, 360, 849, "TO GET UPDATED", 25, WHITE)
                  tx(d, 360, 979, "CURIOSITY WITHOUT LIMITS", 18, SLATE)

              # Shared editorial frame
              rect(d, 28, 25, 664, 66, blend(NAVY, DEEP, .35), 16)
              tx(d, 45, 59, "meanwhile", 24, WHITE, "lm")
              tx(d, 45 + font(24).getlength("meanwhile") / S, 59, "mash", 24, LIME, "lm")
              tx(d, 669, 59, "GAMING / G25", 15, CYAN, "rm")

              if i < 10:
                  rect(d, 30, 119, 660, 139, blend(NAVY, DEEP, .42), 13)
                  tx(d, 360, 169, HEAD[i][0], 39, WHITE)
                  tx(d, 360, 222, HEAD[i][1], 38, ORANGE)
                  rect(d, 32, 1120, 656, 93, blend(NAVY, DEEP, .42), 12)
                  tx(d, 360, 1150, FOOT[i], 18, CYAN)
              else:
                  tx(d, 360, 1128, "SUBSCRIBE TO MEANWHILE MASH", 18, CYAN)

              rect(d, 43, 1228, 634, 4, blend(PURPLE, CYAN, .18), 2)
              rect(d, 43, 1228, 634 * clamp(t / 54), 4, PINK, 2)
              return im

          def build_sfx():
              rng = np.random.default_rng(225)
              mix = np.zeros((round(D * SR), 2), dtype=np.float32)

              def cue(ref, kind="tick", span=.1, amp=.1, pan=0):
                  center = math.ceil((ref * D / 54) * FPS - 1e-7) / FPS
                  start = round(center * SR)
                  n = max(2, round(span * SR))
                  t = np.arange(n) / SR
                  u = t / (n / SR)
                  noise = rng.normal(0, 1, n)
                  freq = np.fft.rfftfreq(n, 1 / SR)
                  spec = np.fft.rfft(noise)
                  spec *= np.minimum(1, (freq / 250) ** 2) * np.minimum(1, (5000 / np.maximum(freq, 1)) ** 3)
                  noise = np.fft.irfft(spec, n)
                  noise /= max(1e-9, np.max(np.abs(noise)))

                  if kind == "impact":
                      v = (.72 * np.sin(2 * np.pi * (90 * t - 100 * t * t)) + .28 * noise) * np.exp(-t * 17)
                  elif kind == "whoosh":
                      v = noise * np.sin(np.pi * u) ** 2
                  elif kind == "cash":
                      v = (.34 * np.sin(2 * np.pi * 510 * t) + .66 * noise) * np.exp(-t * 29)
                  elif kind == "ring":
                      v = (.7 * np.sin(2 * np.pi * (650 * t + 280 * t * t)) + .3 * noise) * np.exp(-t * 12)
                  elif kind == "click":
                      v = (.5 * np.sin(2 * np.pi * 1100 * t) + .5 * noise) * np.exp(-t * 42)
                  else:
                      v = (.6 * np.sin(2 * np.pi * 1300 * t) + .4 * noise) * np.exp(-t * 52)

                  fade = min(96, n // 2)
                  v[:fade] *= np.linspace(0, 1, fade)
                  v[-fade:] *= np.linspace(1, 0, fade)
                  use = min(n, len(mix) - start)
                  if use > 0:
                      mix[start:start+use] += v[:use, None] * amp * np.sqrt([1 - pan, 1 + pan])

              # Anchor events
              events = [
                  (0, "impact"), (.20, "ring"), (.55, "ring"), (1.1, "ring"), (2.2, "whoosh"),
                  (4.5, "impact"), (9, "impact"), (14, "impact"), (19, "impact"), (24, "impact"),
                  (29, "impact"), (35, "impact"), (40, "impact"), (45, "impact"),
                  (49, "whoosh"), (50.2, "ring"), (50.7, "whoosh"), (51.25, "click"), (52.55, "click"), (52.7, "ring")
              ]
              for at, kind in events:
                  cue(at, kind, .44 if kind == "whoosh" else .3 if kind == "impact" else .23, .13)

              def inverse_smooth(v):
                  lo, hi = 0.0, 1.0
                  for _ in range(28):
                      mid = (lo + hi) * .5
                      if ease(mid) < v:
                          lo = mid
                      else:
                          hi = mid
                  return (lo + hi) * .5

              # timeline ticks
              for start, offset, dur in [(4.5, .55, 2.7), (24, .25, 3.3)]:
                  for j in range(1, 14):
                      cue(start + offset + dur * inverse_smooth(j / 13), "click", .055, .072, (-1) ** j * .17)

              # money machine
              for j in range(5):
                  cue(9 + .45 + j * .65 + .45, "cash", .16, .12, (j - 2) * .16)
              for j in range(6):
                  cue(19 + .30 + j * .70 + .38, "cash", .17, .11, (-1) ** j * .18)

              # evidence board links
              for j in range(3):
                  cue(14 + .2 + j * .9 + .5, "cash", .16, .09, (j - 1) * .18)
              for j in range(3):
                  cue(14 + 1 + j * .72 + .44, "ring", .20, .085)

              # city build
              for j in range(6):
                  cue(29 + .3 + j * .72 + .7, "cash", .18, .10, (-1) ** j * .20)

              # release reveal dots
              for j in range(7):
                  cue(40 + .65 + j * .20 + 1.7, "ring", .14, .06)

              peak = float(np.max(np.abs(mix)))
              limit = 10 ** (-9 / 20)
              if peak > limit:
                  mix *= limit / peak

              with wave.open("G25_SFX.wav", "wb") as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  w.writeframes(np.int16(np.clip(mix, -1, 1) * 32767).tobytes())

          if __name__ == "__main__":
              build_sfx()
              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "rawvideo", "-pixel_format", "rgb24",
                  "-video_size", f"{W}x{H}", "-framerate", "30",
                  "-i", "-", "-i", "G25_SFX.wav",
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "160k", "-ar", "48000",
                  "-shortest", "-movflags", "+faststart",
                  a.output
              ]
              with subprocess.Popen(cmd, stdin=subprocess.PIPE) as proc:
                  for k in range(round(D * FPS)):
                      ref_t = k / FPS * 54 / D
                      proc.stdin.write(draw_scene(ref_t).tobytes())
                  proc.stdin.close()
                  if proc.wait() != 0:
                      raise RuntimeError("ffmpeg failed")
          PYCODE

          python -m py_compile render.py
          if [ "$QUALITY" = preview ]; then WIDTH=432; else WIDTH=1080; fi
          python render.py --duration "$DURATION" --width "$WIDTH" --output G25.mp4

          cat > G25_Production_Notes.txt <<'NOTES'
          G25 — Did Rockstar Delay GTA 6 on Purpose?
          This episode is a speculative question, not a factual accusation.
          GTA VI-inspired sunset/neon palette added for stronger GTA-style atmosphere.
          MeanwhileMash branding remains active throughout:
          - meanwhile in white
          - mash in electric lime
          - branded subscribe outro retained
          No official Rockstar visual assets are used.
          The theory remains unverified.
          NOTES

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meanwhilemash-g25-gta-palette
          path: |
            G25.mp4
            G25_SFX.wav
            G25_Production_Notes.txt
          retention-days: 7
