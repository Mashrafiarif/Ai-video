      - name: Render true 3D episode
        shell: bash
        run: |
          case "$QUALITY" in
            preview) set -- --width 360 --height 640 --fps 12 ;;
            full) set -- --width 1080 --height 1920 --fps 24 ;;
            stills) set -- --width 450 --height 800 --still ;;
            *) exit 1 ;;
          esac
          xvfb-run -a -s '-screen 0 1280x2048x24' python episode.py --duration "$DURATION" "$@"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
