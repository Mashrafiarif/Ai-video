name: MeanwhileMash - GTA 6 Hype
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Video duration (seconds); match your voiceover'
        required: true
        default: '40'
      quality:
        description: 'Render resolution'
        type: choice
        options:
          - full
          - preview
        default: full
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          python -m pip install pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render GTA 6 Hype
        env:
          DURATION: ${{ inputs.duration }}
          QUALITY: ${{ inputs.quality }}
        run: |
          cat > render.py <<'MM_RENDERER'
          import argparse, math, random, subprocess
          from functools import lru_cache
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          p=argparse.ArgumentParser(); p.add_argument('--width',type=int,default=1080); p.add_argument('--fps',type=int,default=30); p.add_argument('--output',default='MeanwhileMash_GTA_Hype.mp4'); p.add_argument('--still',type=float); p.add_argument('--duration',type=float,default=40); a=p.parse_args()
          W=a.width; H=W*16//9; H-=H%2; S=W/720; FPS=a.fps; D=a.duration
          L='#C6FF00'; WHITE='#F5F5F5'; SLATE='#64748B'; BG='#101820'; DIM='#9EABB4'; BORDER='#35434B'; PANEL='#19242C'
          @lru_cache(None)
          def font(n,b=True):return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans'+('-Bold' if b else '')+'.ttf',max(1,round(n*S)))
          def pt(x,y):return (round(x*S),round(y*S))
          def box(d,x,y,w,h,c,r=0,stroke=None,sw=1):d.rounded_rectangle([pt(x,y),pt(x+w,y+h)],radius=round(r*S),fill=c,outline=stroke,width=max(1,round(sw*S)))
          def line(d,pts,c,w=1):d.line([pt(*q) for q in pts],fill=c,width=max(1,round(w*S)),joint='curve')
          def poly(d,pts,c):d.polygon([pt(*q) for q in pts],fill=c)
          def ellipse(d,x,y,rx,ry,c=None,stroke=None,sw=1):d.ellipse([pt(x-rx,y-ry),pt(x+rx,y+ry)],fill=c,outline=stroke,width=max(1,round(sw*S)))
          def tx(d,x,y,t,n=32,c=WHITE,anchor='mm',b=True,maxw=650):
           while font(n,b).getlength(t)>maxw*S and n>10:n-=1
           d.text(pt(x,y),t,font=font(n,b),fill=c,anchor=anchor)
          def ease(t): t=max(0.,min(1.,t)); return t*t*(3-2*t)
          def mix(x,y,r):return x+(y-x)*r
          def clamp(t):return max(0,min(1,t))
          def rgb(h):return tuple(int(h[i:i+2],16) for i in (1,3,5))
          def blend(a,b,v):return tuple(round(mix(x,y,v)) for x,y in zip(rgb(a),rgb(b)))
          y,x=np.ogrid[0:H,0:W]; rr=np.sqrt(((x/W-.50)*1.35)**2+((y/H-.53)*1.1)**2); g=np.clip(1-rr*1.65,0,1)**1.7
          back=Image.fromarray(np.uint8(np.array([12,18,24])+g[:,:,None]*np.array([18,27,29])),'RGB')
          del x,y,rr,g
          # Anti-aliased-looking dimensional shapes with graphic highlights, not ray tracing.
          def cuboid(d,x,y,w,h,depth,green=False):
           c1,c2,c3=('#A8D900','#78A400','#D9FF69') if green else ('#55646D','#34434D','#87969C')
           poly(d,[(x,y),(x+w,y),(x+w,y-h),(x,y-h)],c1)
           poly(d,[(x+w,y),(x+w+depth,y-depth*.48),(x+w+depth,y-h-depth*.48),(x+w,y-h)],c2)
           poly(d,[(x,y-h),(x+w,y-h),(x+w+depth,y-h-depth*.48),(x+depth,y-h-depth*.48)],c3)
           line(d,[(x+1,y-h),(x+w,y-h),(x+w+depth,y-h-depth*.48)],'#D4E2D5' if green else '#A1ACAE',1)
          def gamecase(d,x,y,w,h,accent=False,label=''):
           # generic game packaging, no official logo, art or interface
           dep=w*.11; box(d,x-dep,y+dep*.3,w+dep,h,'#0A1116',10)
           poly(d,[(x,y),(x+dep,y-dep*.45),(x+w+dep,y-dep*.45),(x+w,y)],'#9AA8AF' if not accent else '#D8FF75')
           poly(d,[(x+w,y),(x+w+dep,y-dep*.45),(x+w+dep,y+h-dep*.45),(x+w,y+h)],'#304049' if not accent else '#658800')
           box(d,x,y,w,h,'#28363E' if not accent else '#91C000',7)
           box(d,x+6,y+6,w-12,h-12,'#203039' if not accent else '#14211D',5)
           # tiny abstract skyline; intentionally not a game cover
           for k in range(5):
            bh=(.13+(k*7%5)*.045)*h; bx=x+10+k*(w-20)/5; bw=(w-20)/5-2
            box(d,bx,y+h*.68-bh,bw,bh,'#45565D' if not accent else '#556130',1)
           box(d,x+10,y+h*.75,w-20,3,L if accent else '#71828B',1)
           if label:tx(d,x+w/2,y+h*.28,label,max(12,int(w*.22)),L if accent else WHITE,maxw=w-15)
          def grid(d):
           for yy in range(360,1020,42):line(d,[(36,yy),(684,yy)],'#24323A')
           for xx in range(36,685,42):line(d,[(xx,360),(xx,990)],'#24323A')
          def floor(d,cx=360,yy=894):
           for k in range(-5,6):line(d,[(cx+k*21,yy-100),(cx+k*100,yy+95)],'#29383F')
           for z in [0,18,43,75,115]:line(d,[(55,yy+z),(665,yy+z)],'#29383F')
          def shadow(d,x,y,w):ellipse(d,x,y,w,20,'#0C141A');ellipse(d,x,y,w*.75,11,'#0A1116')
          def pill(d,x,y,t,active=False):box(d,x,y,116,33,'#293A35' if active else PANEL,16, '#4E6340' if active else BORDER);tx(d,x+58,y+16,t,13,L if active else DIM)
          def number(d,t,sub):tx(d,360,259,t,91,L,maxw=640);tx(d,360,323,sub,24,WHITE,maxw=630)
          def play(d,x,y,r,active=True):
           ellipse(d,x,y,r,r,'#24363A',L if active else SLATE,2)
           poly(d,[(x-r*.20,y-r*.40),(x-r*.20,y+r*.40),(x+r*.48,y)],L if active else WHITE)
          def person(d,x,y,s,green=False):
           c=L if green else '#6C7A83';ellipse(d,x,y-24*s,9*s,9*s,c);box(d,x-10*s,y-12*s,20*s,28*s,c,6*s);line(d,[(x-5*s,y+14*s),(x-8*s,y+36*s)],c,7*s);line(d,[(x+5*s,y+14*s),(x+8*s,y+36*s)],c,7*s)
          def cash(d,x,y,w,h,active=True):
           cuboid(d,x,y,w,h,14,active)
           for j in range(1,5):line(d,[(x+1,y-h*j/5),(x+w-1,y-h*j/5)],'#5E8200' if active else '#334149')
           box(d,x+w*.43,y-h,w*.16,h,'#D6DCCE' if active else '#96A0A2',1)
          # Reference timeline for the previously supplied narration, based on an estimated read.
          # All timings are scaled by --duration, so users can match an overall voiceover length.
          B=[0,4,10,18,25,31,36,40]
          HEAD=['GTA 6: THE HYPE','A GLOBAL FRANCHISE','THE GTA V LEGACY','THE 13-YEAR WAIT','TRAILER 01','TRAILER 02','WHY THE HYPE?']
          FOOT=['Trailer 2 views across platforms in 24 hours.','Worldwide franchise units sold-in.','A historic entertainment launch.','Between the two mainline releases.','YouTube views in the first 24 hours.','Across platforms in the first 24 hours.','Legacy. Anticipation. Global attention.']
          def frame(time):
           t=time*40/D;i=next((j for j in range(7) if t<B[j+1]),6);q=clamp((t-B[i])/(B[i+1]-B[i])); e=ease(q); im=back.copy();d=ImageDraw.Draw(im)
           # editorial frame; preserve platform safe area
           tx(d,42,53,'meanwhile',24,WHITE,'lm'); tx(d,42+font(24).getlength('meanwhile')/S,53,'mash',24,L,'lm');tx(d,678,53,'GAMING / 03',14,DIM,'rm');line(d,[(42,83),(678,83)],BORDER)
           pill(d,42,108,f'0{i+1} / 07',True);tx(d,678,125,'THE NUMBERS BEHIND IT',13,DIM,'rm');tx(d,360,177,HEAD[i],36,WHITE,maxw=650)
           if i==0:
            # Cold open: the payoff is visible on the very first frame.
            # A quarter-second punch, expanding signal rings and layered screens.
            box(d,42,104,636,101,'#162129',14,BORDER)
            tx(d,360,132,'GTA 6',22,WHITE);tx(d,360,175,'ONE TRAILER. ONE DAY.',36,WHITE)
            # A fast accent streak makes the first frame feel active without flashing.
            for j in range(3):
             xx=60+((q*340+j*205)%610);line(d,[(xx,211),(min(674,xx+55),211)],L,2)
            bump=1+.055*math.exp(-((q-.10)/.065)**2)
            tx(d,360,306,'475M+',round(134*bump),L,maxw=640)
            tx(d,360,393,'VIEWS IN 24 HOURS',32,WHITE)
            # Expanding broadcast rings and an original three-dimensional video tile.
            for j in range(5):
             rr=90+j*32+18*q; pulse=math.exp(-((t-(.15+j*.23))/.16)**2);ellipse(d,360,680,rr,rr*.66,None,blend('#263B38','#B5EF32',.22+.65*pulse),1+round(2*pulse))
            floor(d,360,927);shadow(d,360,875,245)
            for j in range(5):
             a0=j*math.tau/5+q*.35;xx=360+223*math.cos(a0);yy=678+154*math.sin(a0)
             ww=62;hh=40;box(d,xx-ww/2,yy-hh/2,ww,hh,'#28383D',6,'#465B5C');play(d,xx,yy,12,True)
            lift=9*math.sin(q*math.pi);xx=156;yy=540-lift;ww=400;hh=246
            poly(d,[(xx,yy),(xx+20,yy-13),(xx+ww+20,yy-13),(xx+ww,yy)],'#50636A')
            poly(d,[(xx+ww,yy),(xx+ww+20,yy-13),(xx+ww+20,yy+hh-13),(xx+ww,yy+hh)],'#34464B')
            box(d,xx,yy,ww,hh,'#0A1116',18,'#87969C',2);box(d,xx+12,yy+12,ww-24,hh-24,'#203135',12)
            play(d,xx+ww/2,yy+hh/2-9,68)
            box(d,xx+26,yy+hh-35,ww-52,5,'#405158',2);box(d,xx+26,yy+hh-35,(ww-52)*(.18+.82*ease(q*1.8)),5,L,2)
            # Curiosity bridge into the unchanged story.
            tx(d,360,965,'HOW DID IT GET THIS BIG?',30,WHITE,maxw=640)
           elif i==1:
            v=round(475*ease(q*2.2)); number(d,f'{v}M'+('+' if v==475 else ''),'FRANCHISE UNITS SOLD-IN')
            grid(d); cx,cy,r=360,648,228;ellipse(d,cx,cy,r,r,'#24343C','#566B72',2)
            for k in [-2,-1,0,1,2]:
             dy=k*69;rx=math.sqrt(r*r-dy*dy);ellipse(d,cx,cy+dy,rx,13,None,'#425861',1)
            for k in range(4):ellipse(d,cx,cy,30+60*k,r,None,'#4C6167',1)
            for j in range(55):
             z=random.Random(j+40);xx=z.uniform(-1,1);yy=z.uniform(-1,1)
             if xx*xx+yy*yy>.88:continue
             if j/55<ease(q*1.7):ellipse(d,cx+xx*r,cy+yy*r,5,5,L)
            box(d,116,910,488,54,PANEL,12,BORDER);tx(d,360,937,'WORLDWIDE  /  SEPTEMBER 2026',19,DIM)
           elif i==2:
            if q<.49:
             v=round(230*ease(q*5));number(d,f'{v}M'+('+' if v==230 else ''),'GTA V UNITS SOLD-IN')
             floor(d,360,882);shadow(d,360,865,210)
             for j in range(5):
              xx=106+j*101;y=570+(j%2)*28;gamecase(d,xx,y,91,190,j==2,'V')
             tx(d,360,923,'ONE GAME. HUNDREDS OF MILLIONS.',21,DIM)
            else:
             number(d,'$1 BILLION','RETAIL SALES MILESTONE');floor(d,360,881)
             for row in range(3):
              for k in range(5):
               j=row*5+k;progress=ease((q-.49-j*.009)*5);h=(45+(j*31%115))*progress
               if progress>0:cash(d,93+k*100+row*7,851-row*47,78,max(4,h),j%3!=0)
             tx(d,360,930,'RECORD-SETTING SPEED AT LAUNCH',20,WHITE)
           elif i==3:
            number(d,'13 YEARS','2013 TO 2026');grid(d);x0,x1=92,628;y0=668
            line(d,[(x0,y0),(x1,y0)],'#52616A',5);line(d,[(x0,y0),(mix(x0,x1,ease(q*1.6)),y0)],L,5)
            for j in range(14):
             xx=mix(x0,x1,j/13);ellipse(d,xx,y0,6,6,L if j<=13*ease(q*1.6) else SLATE)
            for j,yr in enumerate([2013,2016,2019,2022,2026]):
             xx=mix(x0,x1,(yr-2013)/13);tx(d,xx,y0+40,str(yr),17,WHITE)
            gamecase(d,74,445,116,161,False,'V');gamecase(d,518,445,116,161,True,'VI')
            yr=2013+int(13*ease(q*1.7));box(d,245,772,230,112,PANEL,18,BORDER);tx(d,360,826,str(yr),65,L)
            tx(d,360,942,'A GENERATION OF ANTICIPATION',20,DIM)
           elif i in (4,5):
            goal=93 if i==4 else 475;v=round(goal*ease(q*2.1));number(d,f'{v}M'+('+' if v==goal else ''),'VIEWS IN 24 HOURS');grid(d)
            play(d,360,494,65);tx(d,360,584,'YOUTUBE ONLY' if i==4 else 'ACROSS PLATFORMS',19,DIM)
            # fixed common scale, no implied unique viewers
            for j,(name,val) in enumerate([('TRAILER 1',93),('TRAILER 2',475)] if i==5 else [('TRAILER 1',93)]):
             yy=683+j*111;tx(d,91,yy-22,name,17,WHITE,'lm');box(d,90,yy,540,35,'#27373D',8)
             amount=val/475*(ease(q*2.1) if (i==4 or j==1) else 1);box(d,90,yy,max(2,540*amount),35,L if (i==4 or j==1) else SLATE,8);tx(d,630,yy-22,f'{val}M+',20,L if (i==4 or j==1) else DIM,'rm')
            tx(d,360,930,'VIEWS ARE NOT UNIQUE VIEWERS',19,DIM)
           else:
            tx(d,360,257,'THE PERFECT STORM',43,L)
            for j,(h,n,s) in enumerate([('LEGACY','475M+','franchise units'),('WAIT','13 YEARS','between releases'),('ATTENTION','475M+','trailer 2 views')]):
             yy=405+j*160; f=ease((q-j*.12)*3);xx=mix(83,60,f);box(d,xx,yy,600,132,'#202E34',16,BORDER);box(d,xx+15,yy+16,6,100,L,3);tx(d,xx+39,yy+28,h,17,DIM,'lm');tx(d,xx+39,yy+76,n,48,L,'lm',maxw=305);tx(d,xx+567,yy+76,s,20,WHITE,'rm',maxw=230)
            tx(d,360,944,'CURIOSITY WITHOUT LIMITS.',19,WHITE)
           # Footer: plain fact label and progress; no voice captions burned in.
           box(d,42,1014,636,83,'#162129',12,BORDER);tx(d,61,1041,FOOT[i],20,WHITE,'lm',maxw=594);tx(d,61,1071,'SOURCE: TAKE-TWO / ROCKSTAR GAMES',13,DIM,'lm');line(d,[(42,1135),(678,1135)],BORDER,3);line(d,[(42,1135),(42+636*clamp(t/40),1135)],L,3)
           return im
          if a.still is not None:frame(a.still).save(a.output)
          else:
           cmd=['ffmpeg','-hide_banner','-loglevel','warning','-y','-f','rawvideo','-pixel_format','rgb24','-video_size',f'{W}x{H}','-framerate',str(FPS),'-i','-','-an','-c:v','libx264','-preset','veryfast','-crf','20','-pix_fmt','yuv420p','-movflags','+faststart',a.output]
           with subprocess.Popen(cmd,stdin=subprocess.PIPE) as proc:
            for k in range(round(D*FPS)):
             proc.stdin.write(frame(k/FPS).tobytes())
             if k%(5*FPS)==0:print(f'{k/FPS:.0f}s / {D:g}s',flush=True)
            proc.stdin.close()
            if proc.wait()!=0:raise RuntimeError('FFmpeg failed')
          MM_RENDERER
          python -c 'import os; d=float(os.environ["DURATION"]); assert 20 <= d <= 60, "Duration must be 20–60 seconds"'
          if [ "$QUALITY" = preview ]; then WIDTH=432; else WIDTH=1080; fi
          python render.py --width "$WIDTH" --fps 30 --duration "$DURATION" --output visual_only.mp4
      - name: Generate and synchronize original sound effects
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          cat > sfx.py <<'MM_SFX'
          import argparse, math, wave, random
          import numpy as np
          p=argparse.ArgumentParser();p.add_argument('--duration',type=float,required=True);p.add_argument('--output',default='MeanwhileMash_GTA_Hype_SFX.wav');a=p.parse_args()
          D=a.duration; SR=48000; scale=D/40; rng=np.random.default_rng(621)
          mix=np.zeros((round(D*SR),2),dtype=np.float32)
          def times(d):return np.arange(max(1,round(d*SR)),dtype=np.float64)/SR
          def noise(t,lo,hi):
           x=rng.normal(0,1,len(t));f=np.fft.rfftfreq(len(t),1/SR); b=np.fft.rfft(x);b*=np.minimum(1,(f/max(lo,1))**2)*np.minimum(1,(hi/np.maximum(f,1))**3);z=np.fft.irfft(b,n=len(t));return z/(np.max(np.abs(z))+1e-9)
          def add(at,x,amp=.2,pan=0):
           j=round(at*scale*SR); start=max(0,j); off=start-j;n=min(len(x)-off,len(mix)-start)
           if n<=0:return
           # Short fades keep each individual cue click-free.
           x=np.array(x,dtype=np.float32);fade=min(96,len(x)//2)
           if fade:x[:fade]*=np.linspace(0,1,fade);x[-fade:]*=np.linspace(1,0,fade)
           mix[start:start+n,0]+=amp*x[off:off+n]*math.sqrt(1-pan);mix[start:start+n,1]+=amp*x[off:off+n]*math.sqrt(1+pan)
          def impact(at,amp=.23):
           t=times(.57);f=48*t+45*.095*(1-np.exp(-t/.095));x=.75*np.sin(2*np.pi*f)*np.exp(-t*8)+.25*noise(t,500,3600)*np.exp(-t*22);add(at,x,amp)
          def whoosh(at,d=.34,amp=.12,pan=0):
           t=times(d);env=np.sin(np.pi*t/d)**1.5; x=noise(t,300,3900)*env;add(at,x,amp,pan)
          def pop(at,f=750,amp=.095,pan=0):
           t=times(.105);x=(.8*np.sin(2*np.pi*(f*t+1400*t*t))+.2*noise(t,1200,6500))*np.exp(-t*36);add(at,x,amp,pan)
          def tick(at,amp=.05,pan=0):
           t=times(.038);x=(.6*noise(t,1700,7000)+.4*np.sin(2*np.pi*1500*t))*np.exp(-t*100);add(at,x,amp,pan)
          def flutter(at,pan=0):
           t=times(.14);x=noise(t,380,4200)*np.sin(np.pi*t/.14)**2*(.45+.55*np.sin(2*np.pi*27*t)**2);add(at,x,.105,pan)
          def sweep(at,d=.5):
           t=times(d);x=(.35*np.sin(2*np.pi*(200*t+1800*t*t))+.65*noise(t,500,4800))*np.sin(np.pi*t/d)**2;add(at,x,.11)
          def ease(x):
           x=max(0.,min(1.,x));return x*x*(3-2*x)
          def inv(x):
           lo,hi=0.,1.
           for _ in range(30):
            m=(lo+hi)/2
            if ease(m)<x:lo=m
            else:hi=m
           return (lo+hi)/2
          def frame_at(t):return math.ceil(t*scale*30-1e-8)/(30*scale)
          def ring(at,f=460,amp=.15,pan=0):
           t=times(.32);ph=f*t+130*(1-np.exp(-t*12))/12;x=(.65*np.sin(2*np.pi*ph)+.25*np.sin(2*np.pi*ph*1.51)+.1*noise(t,400,2800))*np.exp(-t*11);add(at,x,amp,pan)
          def digit(at,f=1100,amp=.12,pan=0):
           t=times(.043);ph=f*t+700*t*t;x=(.42*np.sin(2*np.pi*ph)+.36*np.sin(4*np.pi*ph)+.22*noise(t,1600,6800))*np.exp(-t*60);add(at,x,amp,pan)
          def clock(at,alt=False):
           t=times(.082);f=760 if alt else 510;x=(.48*np.sin(2*np.pi*f*t)+.52*noise(t,900,4800))*np.exp(-t*54);add(at,x,.15,.15 if alt else -.15)
          def thud(at,amp=.12,pan=0):
           t=times(.11);x=.65*np.sin(2*np.pi*(100*t-160*t*t))*np.exp(-t*32)+.35*noise(t,200,1800)*np.exp(-t*36);add(at,x,amp,pan)
          def servo(at,length,amp=.075):
           d=length*scale;t=times(d);u=t/d;ph=140*t+330*d*u*u/2;env=np.minimum(1,u*12)*np.minimum(1,(1-u)*12)
           x=(.62*np.sin(2*np.pi*ph)+.18*np.sin(4*np.pi*ph)+.20*noise(t,300,2000))*env*(.7+.3*np.sin(2*np.pi*23*t)**2);add(at,x,amp)
          def counter(start,span,goal,rate):
           # Same smoothstep and rounding as video. Group very rapid digit changes to avoid harsh buzz.
           finish=start+span/rate; last=None;lastcue=-99
           for k in range(math.ceil(start*scale*30-1e-8),math.ceil(finish*scale*30)+1):
            t=k/(30*scale);v=round(goal*ease((t-start)/span*rate))
            if v!=last and v>0 and t*scale-lastcue>=.045:
             digit(t,850+700*v/goal,.16,(-1)**k*.17);lastcue=t*scale
            last=v
           servo(start,span/rate,.065);pop(frame_at(finish),1050,.19)
          def mark(at,f=660,amp=.12):pop(frame_at(at),f,amp)
          # Hook: each visible ring pulse, number impact, and progress motion.
          impact(0,.27);digit(0,1300,.14)
          for j in range(5):ring(.15+j*.23,400+j*82,.17,(-1)**j*.28)
          servo(0,4/1.8,.075);mark(4/1.8,1080);whoosh(.04,.3,.1)
          for j in range(3):digit(.26+j*.19,1450,.075,(-1)**j*.28)
          servo(0,4,.035);whoosh(3.74,.25,.13)
          # Globe: sounds for each emerging dot using the same visual seed and threshold.
          impact(4,.18);counter(4,6,475,2.2);ring(4,470,.13)
          for j in range(55):
           z=random.Random(j+40);x=z.uniform(-1,1);y=z.uniform(-1,1)
           if x*x+y*y>.88:continue
           at=4+6*inv(j/55)/1.7;mark(at,870+(j%7)*83,.085)
          mark(4+6/1.7,1240);whoosh(9.74,.25)
          # GTA V: sales counter and each cash bundle arrival and settling.
          impact(10,.18);counter(10,8,230,5);thud(10,.15)
          whoosh(13.62,.29,.13);impact(13.92,.26);ring(13.92,620,.12)
          for j in range(15):
           at=10+8*(.49+j*.009);flutter(frame_at(at),(j%5-2)*.20);thud(frame_at(at+1.6),.12,(j%5-2)*.20)
          servo(13.92,2.6,.055);mark(16.53,1120);whoosh(17.72,.26)
          # Years and timeline dots trigger separate clock ticks and electronic clicks.
          impact(18,.18);servo(18,7/1.6,.065)
          for j in range(1,14):
           at=18+7*inv(j/13)/1.7;clock(frame_at(at),bool(j%2))
           at2=18+7*inv(j/13)/1.6;digit(frame_at(at2),1380,.09)
          mark(18+7/1.6,970,.15);whoosh(24.72,.26)
          # Trailer counters, play symbols and chart bars each get their own cue.
          for start,span,goal in [(25,6,93),(31,5,475)]:
           impact(start,.20 if goal==93 else .27);ring(start,560,.15);digit(start,1650,.15)
           counter(start,span,goal,2.1);servo(start,span/2.1,.085)
           for frac in [.25,.5,.75,1]:mark(start+span*inv(frac)/2.1,560+frac*550,.10)
           whoosh(start+span-.27,.25,.13)
          # Individual conclusion cards slide into position.
          for j in range(3):
           at=36+4*j*.12;whoosh(at,.34,.15,(j-1)*.18);thud(frame_at(at+.38),.15);mark(at+.38,590+j*170,.15)
          mark(38.65,660,.15);mark(38.86,990,.15)
          # Gentle peak ceiling for adding voiceover later. No music or narration.
          peak=float(np.max(np.abs(mix)));limit=10**(-8/20)
          if peak>limit:mix*=limit/peak
          with wave.open(a.output,'wb') as w:
           w.setnchannels(2);w.setsampwidth(2);w.setframerate(SR);w.writeframes(np.int16(np.clip(mix,-1,1)*32767).tobytes())
          print(f'Synced stereo SFX: {D:g}s; peak {20*math.log10(max(float(np.max(np.abs(mix))),1e-9)):.1f} dBFS')
          MM_SFX
          python sfx.py --duration "$DURATION" --output MeanwhileMash_GTA_Hype_SFX.wav
          ffmpeg -hide_banner -loglevel warning -y -i visual_only.mp4 -i MeanwhileMash_GTA_Hype_SFX.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart MeanwhileMash_GTA_Hype.mp4
